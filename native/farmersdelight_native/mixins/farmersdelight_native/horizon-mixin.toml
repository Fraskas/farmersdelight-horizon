[mod]
id = "farmersdelight_native"
version = "1.3.4-horizon.9d979ca"
priority = 300

# Pinned to the Nightly this port is built for (2026-10-31, 9d979ca); the
# content mod (horizon-mods/farmersdelight) is the same revision's data.
[compatibility]
horizon_revision = "9d979caa48a3bb58203319b9ea044db58c38e0d8"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "farmersdelight"
source = "runtime.rs"

# The block tables of Farmer's Delight's own states and shapes.
[[module]]
id = "tables"
file = "crates/horizon-client/src/mod_content.rs"
name = "farmersdelight_tables"
source = "tables.rs"

# A display made between ticks takes its first tick at once.
[[module]]
id = "display"
file = "crates/horizon-client/src/game/text_displays.rs"
name = "farmersdelight_display"
source = "display.rs"

# The stove's animateTick, in the client's ambient block effects.
[[module]]
id = "animate"
file = "crates/horizon-client/src/animate_tick.rs"
name = "farmersdelight_animate"
source = "stove_animate.rs"

# Rope fences beside changing blocks (their updateShape), read by the game.
[[module]]
id = "ropes"
file = "crates/horizon-client-render/src/world.rs"
name = "farmersdelight_ropes"
source = "ropes.rs"
visibility = "pub"

# NeoForge's creative tab pages, read by the screen in the game crate too.
[[module]]
id = "pages"
file = "crates/horizon-client/src/creative.rs"
name = "farmersdelight_pages"
source = "creative_pages.rs"
visibility = "pub"

# Farmer's Delight's steam particle (SteamParticle), made by the game crate.
[[module]]
id = "steam"
file = "crates/horizon-client-render/src/particles.rs"
